# homelab-mcp: read-only MCP server for Hermes. Owns the two MCP networks; Hermes joins mcp_internal.
#   mcp_internal (br-mcp-int)  internal: Hermes <-> homelab-mcp only, no internet, no host
#   mcp_prom     (br-mcp-prom) homelab-mcp -> Prometheus on the host (172.30.12.1:9090) only
# The host firewall (host/homelab-isolation.nft) enforces the "only" parts.
name: homelab-mcp
services:
  homelab-mcp:
    build:
      context: .
      target: runtime
    image: homelab-mcp:0.1.0
    container_name: homelab-mcp
    restart: unless-stopped
    env_file: .env                      # HOMELAB_MCP_TOKEN (same value in ~/hermes/.env)
    environment:
      PROMETHEUS_URL: http://172.30.12.1:9090
      ALLOWED_HOSTS: homelab-mcp:8000
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
    networks: [mcp_internal, mcp_prom]
    # No ports: only Hermes, on mcp_internal, can reach it. No Docker socket, no host network, no host mounts.

networks:
  mcp_internal:
    name: mcp_internal
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mcp-int
    ipam:
      config:
        - subnet: 172.30.11.0/24
  mcp_prom:
    name: mcp_prom
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mcp-prom
    ipam:
      config:
        - subnet: 172.30.12.0/24
          gateway: 172.30.12.1
